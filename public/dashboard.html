<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Dashboard - Sender</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Animated Mesh Background -->
  <div class="mesh-bg">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>
  
  <div style="display: flex; flex-direction: column; min-height: 100vh; width: 100vw;">
    
    <!-- Top Navbar -->
    <header class="glass-header" style="height: 64px; display: flex; align-items: center; padding: 0 24px; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <i data-lucide="message-circle" color="var(--primary-color)" style="width: 26px; height: 26px;"></i>
        <h1 style="font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.5px;">WA Bulk Sender</h1>
      </div>

      <nav style="display: flex; gap: 12px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border);">
        <a href="/dashboard" style="display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 8px; color: #fff; background: rgba(15, 150, 156, 0.3); border: 1px solid rgba(15, 150, 156, 0.5); font-weight: 500; font-size: 13px;">
          <i data-lucide="send" style="width: 14px; height: 14px;"></i> Sender
        </a>
        <a href="/history" style="display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 8px; color: var(--text-muted); font-weight: 500; font-size: 13px; transition: color 0.2s;">
          <i data-lucide="history" style="width: 14px; height: 14px;"></i> History
        </a>
      </nav>

      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="display: flex; align-items: center; gap: 8px; color: var(--text-dark); font-size: 14px; font-weight: 500;">
          <div style="background: rgba(255,255,255,0.1); padding: 4px; border-radius: 50%;"><i data-lucide="user" style="width: 14px; height: 14px;"></i></div>
          <span id="user-display-name">Mahesh</span>
        </div>
        
        <button id="disconnect-wa-btn" style="display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--warning-color); cursor: pointer; font-size: 13px; font-weight: 500; padding: 0;">
          <i data-lucide="wifi-off" style="width: 14px; height: 14px;"></i> Disconnect
        </button>

        <a href="/" style="display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13px; font-weight: 500;">
          <i data-lucide="log-out" style="width: 14px; height: 14px;"></i> Logout
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main style="flex: 1; padding: 32px 24px; display: flex; flex-direction: column;">
      <div style="width: 100%; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; flex: 1;">
        
        <!-- Stats Row -->
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
          <div class="glass-card" style="text-align: center;">
            <div id="stat-total" style="font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 4px;">0</div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Total</div>
          </div>
          <div class="glass-card" style="text-align: center;">
            <div id="stat-sent" style="font-size: 32px; font-weight: 700; color: var(--accent-color); margin-bottom: 4px;">0</div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Sent</div>
          </div>
          <div class="glass-card" style="text-align: center;">
            <div id="stat-failed" style="font-size: 32px; font-weight: 700; color: var(--danger-color); margin-bottom: 4px;">0</div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Failed</div>
          </div>
          <div class="glass-card" style="text-align: center;">
            <div id="stat-remaining" style="font-size: 32px; font-weight: 700; color: var(--warning-color); margin-bottom: 4px;">0</div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Remaining</div>
          </div>
          <div class="glass-card" style="text-align: center;">
            <div id="stat-current" style="font-size: 32px; font-weight: 700; color: var(--primary-color); margin-bottom: 4px;">-</div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Current #</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1;">
          
          <!-- LEFT COLUMN -->
          <div style="display: flex; flex-direction: column; gap: 24px; height: 100%;">
            
            <div class="glass-panel" style="padding: 24px;">
              <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 20px;">Phone Numbers</h3>
              
              <div style="display: flex; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 4px; margin-bottom: 24px; border: 1px solid var(--glass-border);">
                <button id="tab-upload" style="flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; border: none; display: flex; justify-content: center; align-items: center; gap: 8px; background: rgba(99, 102, 241, 0.15); color: #fff; border: 1px solid rgba(99, 102, 241, 0.3); cursor: pointer; transition: all 0.2s;">
                  <i data-lucide="file-spreadsheet" style="width: 16px; height: 16px;"></i> Upload Excel
                </button>
                <button id="tab-paste" style="flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; border: none; display: flex; justify-content: center; align-items: center; gap: 8px; background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s;">
                  <i data-lucide="clipboard-paste" style="width: 16px; height: 16px;"></i> Paste Numbers
                </button>
              </div>

              <!-- Upload View -->
              <div id="view-upload">
                <label style="border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 40px; text-align: center; background: rgba(0,0,0,0.1); cursor: pointer; display: block; transition: all 0.3s; margin-bottom: 16px;">
                  <i data-lucide="upload-cloud" color="var(--primary-color)" style="width: 36px; height: 36px; margin: 0 auto 16px auto; display: block; opacity: 0.8;"></i>
                  <p style="color: var(--text-dark); margin-bottom: 6px; font-size: 14px;">Drop Excel / CSV here or <span style="color: var(--primary-color); font-weight: 500;">browse</span></p>
                  <p id="upload-status" style="color: var(--text-muted); font-size: 12px;">Extracts 10-digit numbers automatically</p>
                  <input type="file" id="file-input" accept=".xlsx, .xls, .csv" style="display: none;" />
                </label>
                
                <div id="upload-success-box" style="display: none; border: 1px solid var(--accent-color); background: rgba(109, 165, 192, 0.05); border-radius: 12px; padding: 16px;">
                  <div style="display: flex; align-items: center; gap: 8px; color: var(--accent-color); font-weight: 600; font-size: 14px; margin-bottom: 4px;">
                    <i data-lucide="check-square" style="width: 16px; height: 16px;"></i> <span id="success-count">0 numbers loaded</span>
                  </div>
                  <div id="success-preview" style="color: var(--text-muted); font-size: 13px; line-height: 1.5; font-family: monospace;"></div>
                </div>
              </div>

              <!-- Paste View -->
              <div id="view-paste" style="display: none; flex-direction: column; gap: 16px;">
                <textarea id="paste-input" class="glass-input" placeholder="Paste phone numbers here...&#10;&#10;Formats accepted:&#10;9876543210&#10;+91 98765 43210&#10;91-9876543210&#10;9876543210, 9123456789&#10;(One per line or comma separated)" style="width: 100%; height: 160px; font-family: monospace; resize: none;"></textarea>
                <button id="parse-btn" class="glass-btn primary" style="width: 100%;">
                  <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i> Parse Numbers
                </button>
              </div>
            </div>

            <div class="glass-panel" style="padding: 24px; flex: 1; display: flex; flex-direction: column;">
               <h3 style="display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; margin-bottom: 16px;">
                <span>Message Templates</span>
                <button id="add-template-btn" class="glass-btn" style="padding: 6px 12px; font-size: 12px; color: var(--primary-color);">+ Add New</button>
              </h3>
              
              <div id="templates-container" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Templates added dynamically -->
              </div>
            </div>

          </div>

          <!-- RIGHT COLUMN -->
          <div class="glass-panel" style="padding: 24px; display: flex; flex-direction: column;">
            
            <h3 style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; margin-bottom: 24px;">
              <i data-lucide="settings-2" color="var(--primary-color)" style="width: 18px; height: 18px;"></i> Campaign Settings
            </h3>

            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px; background: rgba(0,0,0,0.1); padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border);">
              <span style="color: var(--text-dark); font-size: 14px; font-weight: 500;">Delay between messages:</span>
              <input type="number" id="delay-input" value="1" class="glass-input" style="width: 80px; text-align: center; padding: 8px;">
              <span style="color: var(--text-muted); font-size: 14px;">minutes</span>
            </div>

            <div style="margin-bottom: 32px;">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500;">
                <span>Progress</span>
                <span id="progress-text">0/0</span>
              </div>
              <div style="height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
                <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-hover), var(--primary-color)); transition: width 0.4s ease;"></div>
              </div>
            </div>

            <button id="start-btn" class="glass-btn primary" style="padding: 16px; font-size: 15px; font-weight: 600; justify-content: center; margin-bottom: 32px;">
              <i data-lucide="play" style="width: 18px; height: 18px;" id="start-icon"></i>
              <span id="start-text">Start Campaign</span>
            </button>

            <!-- Activity Log -->
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 200px;">
              <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-dark);">Activity Log</h3>
              
              <div id="activity-log" style="background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 16px; flex: 1; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.5; color: var(--text-dark);">
                <!-- Logs added dynamically -->
              </div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
